# Geometry-only variant; all original configs and outputs retained.
architecture: polyp_pvt_b2
upstream: ../vendor/Polyp-PVT
encoder_checkpoint: ../checkpoints/pvt_v2_b2.pth
train_manifest: ../data/polyp_full/train_all.csv
output: ../runs/polyp_pvt_1450_352_99ep_geom
expected_train_count: 1450
image_size: 352
# Upstream --epoch=100 executes range(1,100), i.e. 99 complete epochs.
epochs: 99
batch_size: 16
learning_rate: 0.0001
weight_decay: 0.0001
gradient_clip: 0.5
# Geometry only: crop, right-angle rotation, horizontal flip. No color jitter.
augmentation: polyp_geometry
scales: [0.75, 1.0, 1.25]
workers: 4
seed: 42
device: cuda
