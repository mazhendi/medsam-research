# Independent branch; pair with polyp_full_aug.yaml (light augmentation).
# Radii are measured in the finest projected feature grid, NOT original pixels.
width: 32
radii: [1.0, 2.0, 4.0]
normal_scale: 0.05
affinity_strength: 4.0
coarse_weight: 0.2
# full | no_contrast | no_constraint | equal_fusion | no_boundary
mode: full

# Corrected: retain the trained SAM mask decoder, task tokens and feature bypasses.
architecture: baseline_adapter
train_decoder: false
