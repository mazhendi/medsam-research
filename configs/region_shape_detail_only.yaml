# V3 mechanism only. Use alongside the unchanged polyp_full_aug.yaml (light).
width: 64
heads: 4
hypotheses: 4
rounds: 2
grid_size: 64
temperature: 0.2
field_clip: 8.0
region_weight: 0.1
field_weight: 0.1
consensus_weight: 0.1
