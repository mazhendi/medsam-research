# Proposed SDS/ADF/RTR model, fixed 352; old configurations remain independent.
architecture: sds_adf_rtr_pvt_b2
upstream: ../vendor/Polyp-PVT
encoder_checkpoint: ../checkpoints/pvt_v2_b2.pth
train_manifest: ../data/polyp_full/train_all.csv
output: ../runs/sds_adf_rtr_352_sds_adf
expected_train_count: 1450
image_size: 352
# Upstream --epoch=100 executes range(1,100), i.e. 99 complete epochs.
epochs: 99
batch_size: 16
learning_rate: 0.0001
weight_decay: 0.0001
gradient_clip: 0.5
# Upstream default augmentation=False; three-scale updates remain enabled.
augmentation: none
scales: [0.75, 1.0, 1.25]
workers: 4
seed: 42
device: cuda

# Coarse and intermediate heads are supervised but never summed at inference.
coarse_weight: 0.5
intermediate_weight: 0.25
decoder:
  width: 64
  sds: true
  adf: true
  rtr: false
  # Fixed continuous gate parameter, not chosen on test sets.
  tau: 0.02
