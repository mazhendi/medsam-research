<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="900" viewBox="0 0 1640 900">
<rect x="0" y="0" width="1640" height="900" rx="0" fill="white" stroke="white" stroke-width="0"/>
<text x="32" y="46" font-family="Liberation Serif, Times New Roman, serif" font-size="31" font-weight="700" text-anchor="start" fill="#242424">C | Boundary-Constrained Cross-Scale Fusion</text>
<text x="32" y="83" font-family="Liberation Serif, Times New Roman, serif" font-size="23" font-weight="400" text-anchor="start" fill="#737373">Applied twice: F3 → F2, then F2 → F1. D and S are computed in parallel.</text>
<rect x="30" y="111" width="1580" height="626" rx="0" fill="#faf7fd" stroke="#8155a6" stroke-width="1.2" stroke-dasharray="8 6"/>
<text x="50" y="146" font-family="Liberation Serif, Times New Roman, serif" font-size="27" font-weight="700" text-anchor="start" fill="#8155a6">Parallel detail / semantic paths with complementary fusion</text>
<rect x="65" y="234" width="145" height="32" rx="4" fill="white" stroke="#337e86" stroke-width="1.3"/>
<text x="137.5" y="258" font-family="Liberation Serif, Times New Roman, serif" font-size="23" font-weight="400" text-anchor="middle" fill="#337e86">Fshallow</text>
<path d="M210,250 L294,250" fill="none" stroke="#337e86" stroke-width="2"/>
<path d="M294,250 L284.0,246.0 L284.0,254.0 Z" fill="#337e86" stroke="#337e86" stroke-width="0"/>
<rect x="294" y="207" width="385" height="86" rx="12" fill="#e8f3f3" stroke="#337e86" stroke-width="1.5"/>
<text x="486.5" y="242.5" font-family="Liberation Serif, Times New Roman, serif" font-size="24" font-weight="400" text-anchor="middle" fill="#242424">Semantic-guided detail</text>
<text x="486.5" y="273.5" font-family="Liberation Serif, Times New Roman, serif" font-size="24" font-weight="400" text-anchor="middle" fill="#242424">D = Fshallow · sigmoid(Conv(U))</text>
<rect x="426" y="147" width="102" height="32" rx="4" fill="white" stroke="#5e804d" stroke-width="1.3"/>
<text x="477.0" y="171" font-family="Liberation Serif, Times New Roman, serif" font-size="23" font-weight="400" text-anchor="middle" fill="#5e804d">U</text>
<path d="M477,179 L477,207" fill="none" stroke="#5e804d" stroke-width="2"/>
<path d="M477,207 L481.0,197.0 L473.0,197.0 Z" fill="#5e804d" stroke="#5e804d" stroke-width="0"/>
<path d="M679,250 L1055,250" fill="none" stroke="#337e86" stroke-width="2"/>
<path d="M1055,250 L1045.0,246.0 L1045.0,254.0 Z" fill="#337e86" stroke="#337e86" stroke-width="0"/>
<circle cx="1071" cy="250" r="15" fill="white" stroke="#8155a6" stroke-width="1.6"/>
<text x="1071" y="257" font-family="Liberation Serif, Times New Roman, serif" font-size="22" font-weight="400" text-anchor="middle" fill="#8155a6">×</text>
<rect x="1021" y="173" width="100" height="32" rx="4" fill="white" stroke="#8155a6" stroke-width="1.3"/>
<text x="1071.0" y="197" font-family="Liberation Serif, Times New Roman, serif" font-size="23" font-weight="400" text-anchor="middle" fill="#8155a6">g</text>
<path d="M1071,205 L1071,234" fill="none" stroke="#8155a6" stroke-width="2"/>
<path d="M1071,234 L1075.0,224.0 L1067.0,224.0 Z" fill="#8155a6" stroke="#8155a6" stroke-width="0"/>
<rect x="65" y="505" width="130" height="32" rx="4" fill="white" stroke="#5e804d" stroke-width="1.3"/>
<text x="130.0" y="529" font-family="Liberation Serif, Times New Roman, serif" font-size="23" font-weight="400" text-anchor="middle" fill="#5e804d">Fdeep</text>
<path d="M195,521 L237,521" fill="none" stroke="#5e804d" stroke-width="2"/>
<path d="M237,521 L227.0,517.0 L227.0,525.0 Z" fill="#5e804d" stroke="#5e804d" stroke-width="0"/>
<rect x="237" y="478" width="212" height="86" rx="12" fill="#edf2e7" stroke="#5e804d" stroke-width="1.5"/>
<text x="343.0" y="514.0" font-family="Liberation Serif, Times New Roman, serif" font-size="23" font-weight="400" text-anchor="middle" fill="#242424">Upsample</text>
<text x="343.0" y="544.0" font-family="Liberation Serif, Times New Roman, serif" font-size="23" font-weight="400" text-anchor="middle" fill="#242424">U = Resize(Fdeep)</text>
<path d="M449,521 L496,521" fill="none" stroke="#5e804d" stroke-width="2"/>
<path d="M496,521 L486.0,517.0 L486.0,525.0 Z" fill="#5e804d" stroke="#5e804d" stroke-width="0"/>
<rect x="496" y="450" width="430" height="142" rx="12" fill="#f0e7f8" stroke="#8155a6" stroke-width="1.5"/>
<text x="711.0" y="500.0" font-family="Liberation Serif, Times New Roman, serif" font-size="22" font-weight="400" text-anchor="middle" fill="#242424">Boundary-constrained 3×3 pooling</text>
<text x="711.0" y="529.0" font-family="Liberation Serif, Times New Roman, serif" font-size="22" font-weight="400" text-anchor="middle" fill="#242424">axy = exp(−lambda |px−py| − |ex−ey|)</text>
<text x="711.0" y="558.0" font-family="Liberation Serif, Times New Roman, serif" font-size="22" font-weight="400" text-anchor="middle" fill="#242424">S = Conv-GN-GELU(normalized pool)</text>
<rect x="571" y="374" width="156" height="32" rx="4" fill="white" stroke="#9e7536" stroke-width="1.3"/>
<text x="649.0" y="398" font-family="Liberation Serif, Times New Roman, serif" font-size="23" font-weight="400" text-anchor="middle" fill="#9e7536">p0, e</text>
<path d="M649,406 L649,450" fill="none" stroke="#9e7536" stroke-width="2"/>
<path d="M649,450 L653.0,440.0 L645.0,440.0 Z" fill="#9e7536" stroke="#9e7536" stroke-width="0"/>
<path d="M926,521 L1055,521" fill="none" stroke="#8155a6" stroke-width="2"/>
<path d="M1055,521 L1045.0,517.0 L1045.0,525.0 Z" fill="#8155a6" stroke="#8155a6" stroke-width="0"/>
<circle cx="1071" cy="521" r="15" fill="white" stroke="#8155a6" stroke-width="1.6"/>
<text x="1071" y="528" font-family="Liberation Serif, Times New Roman, serif" font-size="22" font-weight="400" text-anchor="middle" fill="#8155a6">×</text>
<rect x="1001" y="590" width="140" height="32" rx="4" fill="white" stroke="#8155a6" stroke-width="1.3"/>
<text x="1071.0" y="614" font-family="Liberation Serif, Times New Roman, serif" font-size="23" font-weight="400" text-anchor="middle" fill="#8155a6">1 − g</text>
<path d="M1071,590 L1071,537" fill="none" stroke="#8155a6" stroke-width="2"/>
<path d="M1071,537 L1067.0,547.0 L1075.0,547.0 Z" fill="#8155a6" stroke="#8155a6" stroke-width="0"/>
<path d="M1087,250 L1237,250 L1237,369" fill="none" stroke="#8155a6" stroke-width="2"/>
<path d="M1237,369 L1241.0,359.0 L1233.0,359.0 Z" fill="#8155a6" stroke="#8155a6" stroke-width="0"/>
<path d="M1087,521 L1237,521 L1237,401" fill="none" stroke="#8155a6" stroke-width="2"/>
<path d="M1237,401 L1233.0,411.0 L1241.0,411.0 Z" fill="#8155a6" stroke="#8155a6" stroke-width="0"/>
<circle cx="1237" cy="385" r="15" fill="white" stroke="#8155a6" stroke-width="1.6"/>
<text x="1237" y="392" font-family="Liberation Serif, Times New Roman, serif" font-size="22" font-weight="400" text-anchor="middle" fill="#8155a6">+</text>
<path d="M1253,385 L1410,385" fill="none" stroke="#8155a6" stroke-width="2"/>
<path d="M1410,385 L1400.0,381.0 L1400.0,389.0 Z" fill="#8155a6" stroke="#8155a6" stroke-width="0"/>
<rect x="1410" y="369" width="138" height="32" rx="4" fill="white" stroke="#8155a6" stroke-width="1.3"/>
<text x="1479.0" y="393" font-family="Liberation Serif, Times New Roman, serif" font-size="23" font-weight="400" text-anchor="middle" fill="#8155a6">Fout</text>
<rect x="69" y="630" width="432" height="65" rx="12" fill="#fcf4e6" stroke="#9e7536" stroke-width="1.5"/>
<text x="285.0" y="670.5" font-family="Liberation Serif, Times New Roman, serif" font-size="23" font-weight="400" text-anchor="middle" fill="#242424">B → Conv1×1 → sigmoid → e</text>
<rect x="595" y="630" width="827" height="65" rx="12" fill="#f0e7f8" stroke="#8155a6" stroke-width="1.5"/>
<text x="1008.5" y="670.5" font-family="Liberation Serif, Times New Roman, serif" font-size="23" font-weight="400" text-anchor="middle" fill="#242424">g = sigmoid(Conv1×1([D, S, B]))    |    e and g are learned gates</text>
<text x="820" y="789" font-family="Liberation Serif, Times New Roman, serif" font-size="29" font-weight="400" text-anchor="middle" fill="#8155a6">Fout = g · D + (1−g) · S</text>
<text x="32" y="858" font-family="Liberation Serif, Times New Roman, serif" font-size="22" font-weight="400" text-anchor="start" fill="#737373">Boundary affinity is continuous; p0 and B can receive gradients through the semantic branch.</text>
</svg>