[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medsam-research"
version = "0.0.1"
description = "Research scaffold for SAM-based medical image segmentation"
requires-python = ">=3.10"
# 训练依赖将在锁定 SAM 2 官方版本后明确添加。
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
