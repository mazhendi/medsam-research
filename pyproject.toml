[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medsam-research"
version = "0.2.0"
description = "Reproducible SAM 2.1 automatic binary medical segmentation baseline"
requires-python = ">=3.10"
dependencies = ["torch>=2.5.1", "numpy>=1.24", "Pillow>=10", "PyYAML>=6", "scipy>=1.11", "scikit-image>=0.22"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
captions = ["transformers>=4.49,<4.50", "accelerate==1.3.0", "huggingface-hub>=0.28,<1"]
text = ["open_clip_torch==2.32.0", "transformers>=4.45,<4.50", "huggingface-hub>=0.28,<1", "timm>=1.0.12,<1.1"]

[project.scripts]
medsam = "medsam_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires optional official model checkouts or downloaded weights"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
